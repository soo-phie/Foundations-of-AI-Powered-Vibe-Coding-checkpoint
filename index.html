<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YOUR NAME | Frontend Developer</title>

  <!-- MANUAL IMPROVEMENT: custom font (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 70%);
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 700;
      letter-spacing: 0.02em; /* MANUAL IMPROVEMENT: wider letter spacing */
    }

    .hero h1 span { color: #38bdf8; }

    .subtitle {
      margin: 0 0 20px;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 600;
      color: #cbd5e1;
    }

    .description {
      max-width: 560px;
      margin: 0 0 36px;
      line-height: 1.8; /* MANUAL IMPROVEMENT: more line spacing */
      color: #94a3b8;
    }

    .btn {
      padding: 14px 34px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
      background: #38bdf8;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Hi, I'm <span>YOUR NAME</span></h1>
    <p class="subtitle">Frontend Developer building clean, fast and accessible web experiences</p>
    <p class="description">
      I'm passionate about turning ideas into interactive interfaces. My goal is to grow
      as a frontend developer and build products that people love to use.
    </p>
    <button class="btn" onclick="alert('Projects coming soon!')">View My Projects</button>
  </section>
</body>
</html>
